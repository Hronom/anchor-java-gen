name: Run tests on PR

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set variables
        run: |
          echo "${{ secrets.SAVA_GITHUB_USERNAME }}" > github_username.secret
          echo "${{ secrets.SAVA_GITHUB_TOKEN }}" > github_token.secret

      - name: Run test
        run: |
          docker compose -f compose.test.ci.yaml up --menu=false --quiet-pull --build --exit-code-from anchor-java-gen
